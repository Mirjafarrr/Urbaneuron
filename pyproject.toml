[project]
name = "urbaneuron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.35",
    "geopandas>=1.1.3",
    "h5netcdf>=1.8.1",
    "matplotlib>=3.11.0",
    "mercantile>=1.2.1",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "osmnx>=2.1.0",
    "pandas>=3.0.3",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "tqdm>=4.68.3",
    "xarray>=2026.4.0",
    "albumentations>=1.4.0",
    "timm>=1.0.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
