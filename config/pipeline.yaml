paths:
  loveda_raw: data/raw/LoveDA Dataset
  processed_tiles: data/processed
  final_data: data/final

classes:
  names:
    0: ignore
    1: background
    2: building
    3: road
    4: water
    5: barren
    6: forest
    7: agriculture
  num_classes: 8
  ignore_index: 0

data:
  split:
    val_frac: 0.10
    train_urban_frac: 0.85
    random_seed: 42
  tile_size: 512
  source_size: 1024
  grid_rows: 2
  grid_cols: 2

model:
  architecture: unet_plusplus
  encoder: resnext50_32x4d
  pretrained: true
  input_size: [512, 512]
  num_classes: 8

training:
  epochs: 50
  batch_size: 32
  num_workers: 16
  optimizer: AdamW
  encoder_lr: 5.0e-5
  decoder_lr: 5.0e-4
  mixed_precision: true
  gradient_accumulation_steps: 1
  checkpoint_dir: checkpoints
  save_every: 1
  log_interval: 10
  scheduler:
    type: plateaus
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6
  loss:
    type: crossentropy+dice
    ignore_index: 0
    ce_weight: 0.7
    dice_weight: 0.3
    class_weights: inverse_frequency